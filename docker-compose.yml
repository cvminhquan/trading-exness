services:
  postgres:
    image: postgres:16-alpine
    container_name: exness-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: exness_bot
      POSTGRES_PASSWORD: exness_bot
      POSTGRES_DB: exness_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exness_bot -d exness_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
