[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exness-bot"
version = "0.1.0"
description = "Modular algorithmic trading engine for Exness via MetaTrader 5"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Exness Bot Team" }]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
mt5 = [
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "pandas-stubs>=2.2.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
exness-bot = "exness_bot.cli:main"
exness-bot-api = "exness_bot.api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exness_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "mt5: tests requiring MetaTrader 5 terminal (deselect with '-m \"not mt5\"')",
    "integration: integration tests requiring external services",
]
addopts = "-m 'not mt5 and not integration'"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["exness_bot"]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["MetaTrader5.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/exness_bot"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
